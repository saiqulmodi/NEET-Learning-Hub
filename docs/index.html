<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEET Learning Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a study desk. A sticky top bar, then one working column; the Class 1 -> 12 -> NEET ladder is the spine of the home page. Subject colours follow the NEET paper: Physics, Chemistry, Biology. */
:root {
  --bg: #f3f5f7; --panel: #ffffff; --raise: #eef1f4; --line: #dde2e8; --ink: #15202b; --muted: #5d6b79;
  --accent: #4d43c9; --accent-ink: #ffffff;
  --phy: #2f6bd8; --che: #c8721f; --bio: #2b8f62; --good: #23865a; --bad: #c9384f; --mark: #b8860b;
  --display: "Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --serif: "Source Serif 4", Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e141b; --panel: #161f2a; --raise: #1d2834; --line: #2a3644; --ink: #e6edf3; --muted: #9aa8b6;
  --accent: #8f86ff; --accent-ink: #12102b; --phy: #6ea0ff; --che: #f0a35a; --bio: #5cc795; --good: #4cc48a; --bad: #ff6b81; --mark: #e5b84b; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e141b; --panel: #161f2a; --raise: #1d2834; --line: #2a3644; --ink: #e6edf3; --muted: #9aa8b6;
  --accent: #8f86ff; --accent-ink: #12102b; --phy: #6ea0ff; --che: #f0a35a; --bio: #5cc795; --good: #4cc48a; --bad: #ff6b81; --mark: #e5b84b; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
[hidden] { display: none !important; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--panel); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 16px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); flex-wrap: wrap; }
.brand { font: 700 19px/1 var(--display); letter-spacing: -0.01em; margin-right: auto; display: flex; align-items: baseline; gap: 8px; }
.brand small { font: 500 11px var(--mono); color: var(--muted); letter-spacing: 0.04em; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav a { text-decoration: none; color: var(--muted); padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 14px; }
nav a.on { background: var(--raise); color: var(--ink); }

main { max-width: 1100px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 60px max(16px, env(safe-area-inset-left, 0px)); }
h1 { font: 700 clamp(26px, 4.5vw, 38px)/1.1 var(--display); letter-spacing: -0.015em; margin: 0 0 8px; text-wrap: balance; }
h2 { font: 700 22px/1.2 var(--display); margin: 0 0 10px; }
h3 { font: 600 16px/1.3 var(--display); margin: 0 0 6px; }
.lead { color: var(--muted); max-width: 66ch; margin: 0 0 18px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.eyebrow { font: 600 11px/1.2 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 16px; font-weight: 600; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.small { padding: 5px 11px; font-size: 13px; border-radius: 8px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ladder */
.ladder { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 6px; margin: 4px 0 22px; }
@media (max-width: 760px) { .ladder { grid-template-columns: repeat(7, minmax(0, 1fr)); } }
.rung { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 4px 7px; text-align: center; position: relative; }
.rung b { display: block; font: 700 18px/1 var(--display); }
.rung span { font: 500 10px var(--mono); color: var(--muted); }
.rung.on { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
.rung .bar { position: absolute; left: 6px; right: 6px; bottom: 3px; height: 3px; border-radius: 2px; background: var(--raise); overflow: hidden; }
.rung .bar i { display: block; height: 100%; background: var(--good); }
.rung.neet { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.rung.neet span { color: var(--accent-ink); opacity: 0.8; }
.rung.neet.on { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }

.subjects { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 900px) { .subjects { grid-template-columns: minmax(0, 1fr); } }
.subj { background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 14px; padding: 14px; min-width: 0; }
.subj header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.subj header h2 { margin: 0; color: var(--c); font-size: 20px; }
.unit { font: 600 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin: 12px 0 4px; }
.ch { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 9px 0; border-top: 1px solid var(--line); align-items: center; }
.ch:first-of-type { border-top: 0; }
.ch-title { font-weight: 600; min-width: 0; }
.ch-meta { grid-column: 1; font: 12px var(--mono); color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.ch .btn { grid-row: 1 / span 2; grid-column: 2; }
.ch .prog { grid-column: 1; height: 4px; border-radius: 2px; background: var(--raise); overflow: hidden; margin-top: 3px; }
.ch .prog i { display: block; height: 100%; background: var(--c); }
.ecos { font: 600 11px var(--mono); color: var(--bio); text-decoration: none; }
.tag-beyond { font: 600 10px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }

/* practice / question card */
.qwrap { max-width: 760px; margin: 0 auto; }
.qhead { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.qcard { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
.qtext { font: 400 19px/1.5 var(--serif); margin: 0 0 16px; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; display: flex; gap: 12px; align-items: baseline; border: 1px solid var(--line); background: var(--raise); border-radius: 12px; padding: 11px 14px; font: 400 16px/1.4 var(--serif); }
.opt .l { font: 600 13px var(--mono); color: var(--muted); flex: none; width: 1.4em; }
.opt:disabled { cursor: default; }
.opt.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.opt.right { border-color: var(--good); box-shadow: inset 0 0 0 2px var(--good); }
.opt.wrong { border-color: var(--bad); box-shadow: inset 0 0 0 2px var(--bad); }
.explain { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--raise); border-left: 3px solid var(--good); }
.explain.bad { border-left-color: var(--bad); }
.explain b { display: block; margin-bottom: 2px; }
.src { font: 11px var(--mono); color: var(--muted); margin-top: 12px; }
.qfoot { display: flex; justify-content: space-between; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.dots { display: flex; gap: 4px; flex-wrap: wrap; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--raise); border: 1px solid var(--line); }
.dots i.r { background: var(--good); border-color: var(--good); }
.dots i.w { background: var(--bad); border-color: var(--bad); }
.dots i.c { border-color: var(--accent); }
.summary { text-align: center; padding: 26px 20px; }
.big { font: 700 54px/1 var(--display); color: var(--accent); }

/* mock test */
.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin: 16px 0; }
@media (max-width: 760px) { .modes { grid-template-columns: minmax(0, 1fr); } }
.mode { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.mode .big { font-size: 40px; }
.pattern { width: 100%; border-collapse: collapse; font-size: 14px; }
.pattern td, .pattern th { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
.pattern th { font: 600 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.scroll-x { overflow-x: auto; }
.test { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 16px; align-items: start; }
@media (max-width: 900px) { .test { grid-template-columns: minmax(0, 1fr); } }
.testbar { position: sticky; top: calc(56px + env(safe-area-inset-top, 0px)); z-index: 5; background: var(--bg); padding: 8px 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.timer { font: 600 20px var(--mono); }
.timer.low { color: var(--bad); }
.stabs { display: flex; gap: 6px; flex-wrap: wrap; }
.stab { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; }
.stab.on { background: var(--c); color: #fff; border-color: transparent; }
.omr { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.omr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(30px, 1fr)); gap: 5px; max-height: 360px; overflow-y: auto; padding: 2px; justify-items: center; }
.bub { aspect-ratio: 1; width: 100%; max-width: 36px; border-radius: 50%; border: 1.5px solid var(--line); background: transparent; font: 600 10px var(--mono); display: grid; place-items: center; padding: 0; }
.bub.ans { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.bub.rev { border-color: var(--mark); box-shadow: inset 0 0 0 2px var(--mark); }
.bub.cur { outline: 2px solid var(--ink); outline-offset: 1px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font: 11px var(--mono); color: var(--muted); margin-top: 8px; }
.confirm { background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 10px; }
.score-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 16px 0; }
@media (max-width: 760px) { .score-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; border-top: 3px solid var(--c, var(--accent)); }
.tile b { display: block; font: 700 26px/1.1 var(--display); }
.tile span { font: 12px var(--mono); color: var(--muted); }

/* progress */
.weak { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.weak li { display: flex; justify-content: space-between; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--c); border-radius: 10px; padding: 8px 12px; align-items: center; }
.weak li > div { min-width: 0; }
.hist { width: 100%; border-collapse: collapse; font-size: 14px; }
.hist td, .hist th { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
.hist th { font: 600 11px var(--mono); color: var(--muted); text-transform: uppercase; }
.note { font-size: 13px; color: var(--muted); }
.loading { color: var(--muted); padding: 30px 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">NEET Learning Hub <small>Class 1 → 12 → MBBS</small></div>
    <nav>
      <a href="#path" data-nav="path">Path</a>
      <a href="#mock" data-nav="mock">Mock test</a>
      <a href="#progress" data-nav="progress">My progress</a>
    </nav>
  </div>
</header>
<main id="app"><p class="loading">Loading the question hub...</p></main>
<script src="app.js"></script>
</body>
</html>
